[project]
name = "sc"
version = "0.4.6"
description = "Allowlisted bidirectional sync between a private Git vault and collaborator repos"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SteffenPL" }]
keywords = ["git", "sync", "sharing", "privacy"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Repository = "https://github.com/SteffenPL/sc"

[project.scripts]
sc = "sc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sc"]
