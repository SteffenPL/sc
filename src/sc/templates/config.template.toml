# sc configuration — private by default.
# Maps pair repositories (folder-level routing); permissions grant files.
# Nothing is shared unless a permission grants it through a map.
# Check with `sc doctor`; apply with `sc sync` (add --initialize once for
# new pairs, or --dry-run to preview without pushing).

# A map pairs exactly two repositories. Endpoints are 'Owner/Repo[/folder]';
# the optional folder is a prefix: stripped from that side's paths and added
# to the other side's outgoing files. 'name' is unique and names the private
# sync-state/<name> baseline branch on the from side.
# Knobs (defaults shown): merge = "text" | "union"; conflict = "swap" |
# "to-wins" | "freeze"; bi_directional = true | false (one-way mirror).

[[maps]]
name = "example"
from = "OWNER/VAULT"
to   = "OWNER/COLLABORATOR/shared-folder"
# from_branch = "main"               # optional; defaults to "main"
# to_branch = "main"
# merge = "union"                    # opt-in: keep both sides' overlapping lines
# conflict = "swap"                  # freeze files + review PRs on both sides
# bi_directional = true

# Permissions grant path patterns to travel through named maps.
# Paths are full 'Owner/Repo/path' — or relative when a repo context is given.
# Globs: '*' one segment, '**' any depth, '{a,b}' alternatives. A glob is
# folder-level pre-consent: files later created under it by EITHER side sync
# automatically. Review expanded matches with `sc sync --dry-run`.

[[permissions]]
repo = "OWNER/VAULT"                  # optional context for relative paths
paths = [
    "Projects/Example.md",
    # "Projects/*.md",
    # "{Projects,References}/**",
]
maps = ["example"]

[sync]                               # entirely optional
interval = 900                       # `sc watch` poll interval in seconds (>= 60)
